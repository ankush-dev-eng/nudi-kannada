<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" rx="16" fill="#F7F0E1" stroke="#D9CBB0" stroke-width="2" />
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#FFFFFF" />
  <text x="32" y="36" font-family="'Noto Serif Kannada', serif" font-size="20" font-weight="bold" fill="#9E2A2B">ನುಡಿ</text>
  <text x="75" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2B1D14">Nudi — Kannada for Everyday Life</text>
  <rect x="700" y="16" width="68" height="24" rx="12" fill="#E9DCC3" />
  <text x="734" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9E2A2B" text-anchor="middle">🔥 3 days</text>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#9E2A2B" stroke-width="3" />

  <!-- Hero text -->
  <text x="400" y="105" font-family="'Noto Serif Kannada', serif" font-size="26" font-weight="bold" fill="#9E2A2B" text-anchor="middle">ಕನ್ನಡ ಕಲಿಯಿರಿ • Speak Kannada</text>
  <text x="400" y="132" font-family="sans-serif" font-size="14" fill="#7A6A58" text-anchor="middle">A situation-first companion helping newcomers navigate Bengaluru &amp; Karnataka</text>

  <!-- Situations Grid -->
  <g transform="translate(48, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D9CBB0" />
    <circle cx="36" cy="36" r="18" fill="#E9DCC3" />
    <text x="36" y="42" font-size="18" text-anchor="middle">🛺</text>
    <text x="65" y="34" font-family="'Noto Serif Kannada', serif" font-size="16" font-weight="bold" fill="#9E2A2B">ಪ್ರಯಾಣ</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#7A6A58">Travel &amp; Commute</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#2B1D14">Autos, metro &amp; BMTC buses</text>
    <rect x="20" y="115" width="180" height="20" rx="4" fill="#2F5D50" />
    <text x="110" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">11 Phrases • 2 Roleplays</text>
  </g>

  <g transform="translate(290, 160)">
    <!-- Card 2 -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D9CBB0" />
    <circle cx="36" cy="36" r="18" fill="#E9DCC3" />
    <text x="36" y="42" font-size="18" text-anchor="middle">🛍️</text>
    <text x="65" y="34" font-family="'Noto Serif Kannada', serif" font-size="16" font-weight="bold" fill="#9E2A2B">ಖರೀದಿ</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#7A6A58">Market &amp; Shopping</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#2B1D14">Vegetables, fruits &amp; bargaining</text>
    <rect x="20" y="115" width="180" height="20" rx="4" fill="#2F5D50" />
    <text x="110" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">10 Phrases • 2 Roleplays</text>
  </g>

  <g transform="translate(532, 160)">
    <!-- Card 3 -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D9CBB0" />
    <circle cx="36" cy="36" r="18" fill="#E9DCC3" />
    <text x="36" y="42" font-size="18" text-anchor="middle">🏥</text>
    <text x="65" y="34" font-family="'Noto Serif Kannada', serif" font-size="16" font-weight="bold" fill="#9E2A2B">ಆರೋಗ್ಯ</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#7A6A58">Healthcare &amp; Clinic</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#2B1D14">Symptoms &amp; pharmacy</text>
    <rect x="20" y="115" width="180" height="20" rx="4" fill="#2F5D50" />
    <text x="110" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">10 Phrases • 2 Roleplays</text>
  </g>

  <!-- Bottom Nav -->
  <rect x="0" y="468" width="800" height="52" fill="#FFFFFF" stroke="#D9CBB0" stroke-width="1" />
  <text x="100" y="500" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9E2A2B" text-anchor="middle">🏠 Home</text>
  <text x="300" y="500" font-family="sans-serif" font-size="13" fill="#7A6A58" text-anchor="middle">🔄 Review</text>
  <text x="500" y="500" font-family="sans-serif" font-size="13" fill="#7A6A58" text-anchor="middle">📖 Read It</text>
  <text x="700" y="500" font-family="sans-serif" font-size="13" fill="#7A6A58" text-anchor="middle">ℹ️ About</text>
</svg>
