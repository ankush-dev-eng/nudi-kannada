<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" rx="16" fill="#F7F0E1" stroke="#D9CBB0" stroke-width="2" />
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#FFFFFF" />
  <text x="32" y="34" font-family="sans-serif" font-size="14" font-weight="600" fill="#7A6A58">← Situations</text>
  <text x="400" y="36" font-family="'Noto Serif Kannada', serif" font-size="18" font-weight="bold" fill="#9E2A2B" text-anchor="middle">ಸಂಭಾಷಣೆ • Auto Rickshaw Roleplay</text>

  <!-- Chat Log Area -->
  <g transform="translate(100, 80)">
    <!-- Partner Bubble -->
    <rect x="0" y="0" width="380" height="85" rx="8" fill="#E9DCC3" stroke="#D9CBB0" />
    <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7A6A58">AUTO DRIVER (ಆಟೋ ಚಾಲಕರು)</text>
    <text x="16" y="46" font-family="'Noto Serif Kannada', serif" font-size="18" font-weight="bold" fill="#9E2A2B">ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು ಸರ್?</text>
    <text x="16" y="68" font-family="sans-serif" font-size="12" fill="#2B1D14">Ellige hogabeku sir? (Where do you want to go sir?)</text>

    <!-- User Bubble -->
    <rect x="220" y="105" width="380" height="85" rx="8" fill="#2F5D50" />
    <text x="236" y="127" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A8D5C8">YOU (ನೀವು)</text>
    <text x="236" y="151" font-family="'Noto Serif Kannada', serif" font-size="18" font-weight="bold" fill="#FFFFFF">ಮೆಜೆಸ್ಟಿಕ್‌ಗೆ ಹೋಗಬೇಕು, ಮೀಟರ್ ಹಾಕಿ.</text>
    <text x="236" y="173" font-family="sans-serif" font-size="12" fill="#E9DCC3">Need to go to Majestic, please put the meter.</text>

    <!-- Partner Followup Bubble -->
    <rect x="0" y="210" width="380" height="85" rx="8" fill="#E9DCC3" stroke="#D9CBB0" />
    <text x="16" y="232" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7A6A58">AUTO DRIVER (ಆಟೋ ಚಾಲಕರು)</text>
    <text x="16" y="256" font-family="'Noto Serif Kannada', serif" font-size="18" font-weight="bold" fill="#9E2A2B">ಸರಿ ಸರ್, ಬನ್ನಿ ಕುಳಿತುಕೊಳ್ಳಿ.</text>
    <text x="16" y="278" font-family="sans-serif" font-size="12" fill="#2B1D14">Sari sir, banni kulithukolli. (Okay sir, please come and sit.)</text>
  </g>

  <!-- Response Option Section -->
  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="600" height="85" rx="8" fill="#FFFFFF" stroke="#D9CBB0" />
    <text x="20" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7A6A58">CHOOSE YOUR NEXT KANNADA REPLY:</text>
    <rect x="20" y="38" width="560" height="36" rx="4" fill="#E9DCC3" stroke="#9E2A2B" />
    <text x="35" y="61" font-family="'Noto Serif Kannada', serif" font-size="14" font-weight="bold" fill="#9E2A2B">ಧನ್ಯವಾದಗಳು! (Dhanyavadagalu! — Thank you!)</text>
  </g>
</svg>
