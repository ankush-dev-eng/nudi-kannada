<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" rx="16" fill="#F7F0E1" stroke="#D9CBB0" stroke-width="2" />
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#FFFFFF" />
  <text x="32" y="34" font-family="sans-serif" font-size="14" font-weight="600" fill="#7A6A58">← Home</text>
  <text x="400" y="36" font-family="'Noto Serif Kannada', serif" font-size="18" font-weight="bold" fill="#9E2A2B" text-anchor="middle">ಲಿಪಿ ಸಹಾಯಕ • Kannada Script &amp; Civic Signs</text>

  <!-- Civic Sign Board -->
  <g transform="translate(150, 85)">
    <rect x="0" y="0" width="500" height="150" rx="8" fill="#1A3C34" stroke="#E9DCC3" stroke-width="4" />
    <text x="250" y="65" font-family="'Noto Serif Kannada', serif" font-size="38" font-weight="bold" fill="#F7F0E1" text-anchor="middle">ಪ್ರವೇಶ</text>
    <rect x="190" y="95" width="120" height="24" rx="4" fill="rgba(255,255,255,0.2)" />
    <text x="250" y="111" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">🔊 Hear Audio</text>
  </g>

  <!-- 4 Sign Quiz Options -->
  <g transform="translate(150, 260)">
    <!-- Correct Option -->
    <rect x="0" y="0" width="235" height="50" rx="6" fill="rgba(47,93,80,0.15)" stroke="#2F5D50" stroke-width="2" />
    <text x="117" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2F5D50" text-anchor="middle">Entrance / Entry ✓</text>

    <!-- Other Options -->
    <rect x="265" y="0" width="235" height="50" rx="6" fill="#FFFFFF" stroke="#D9CBB0" />
    <text x="382" y="30" font-family="sans-serif" font-size="14" fill="#2B1D14" text-anchor="middle">Exit / Way Out</text>

    <rect x="0" y="65" width="235" height="50" rx="6" fill="#FFFFFF" stroke="#D9CBB0" />
    <text x="117" y="95" font-family="sans-serif" font-size="14" fill="#2B1D14" text-anchor="middle">No Parking</text>

    <rect x="265" y="65" width="235" height="50" rx="6" fill="#FFFFFF" stroke="#D9CBB0" />
    <text x="382" y="95" font-family="sans-serif" font-size="14" fill="#2B1D14" text-anchor="middle">Ticket Counter</text>
  </g>

  <!-- Feedback explanation -->
  <g transform="translate(150, 400)">
    <rect x="0" y="0" width="500" height="75" rx="6" fill="#E9DCC3" stroke="#D9CBB0" />
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2F5D50">✅ ಸರಿ! Correct: /Pravesha/</text>
    <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#2B1D14">Seen on doorways of Namma Metro stations, government buildings, and hospitals.</text>
  </g>
</svg>
